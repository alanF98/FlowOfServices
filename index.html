<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Website Brief · Demo</title>
    <style>
      body {
        margin: 0;
        padding: 40px 16px;
        background: #eef0f6;
        font-family: system-ui, sans-serif;
        color: #0f172a;
      }
      main { max-width: 1100px; margin: 0 auto; }
      header { text-align: center; margin-bottom: 28px; }
      header h1 { margin: 0 0 8px; font-size: clamp(1.6rem, 4vw, 2.4rem); }
      header p { margin: 0; color: #64748b; }
      .lang { display: inline-flex; gap: 4px; margin-top: 16px; padding: 4px; background: #fff; border-radius: 999px; border: 1px solid #e5e7eb; }
      .lang button { border: 0; background: none; padding: 6px 14px; border-radius: 999px; cursor: pointer; font: inherit; font-weight: 600; color: #64748b; }
      .lang button[aria-pressed="true"] { background: #4f46e5; color: #fff; }
      details { margin-top: 32px; }
      summary { cursor: pointer; font-weight: 600; }
      pre {
        background: #0f172a; color: #e2e8f0; padding: 16px; border-radius: 10px;
        font-size: 12px; overflow-x: auto; white-space: pre-wrap; word-break: break-word;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1 id="headline">Your website, ready in minutes</h1>
        <p id="subline">Answer a few quick questions and our AI builds it for you.</p>
        <div class="lang" role="group" aria-label="Language">
          <button data-lang="en" aria-pressed="true">EN</button>
          <button data-lang="es" aria-pressed="false">ES</button>
        </div>
      </header>

      <!-- This is how you embed the component on any page -->
      <website-brief id="brief" lang="en"></website-brief>

      <details open>
        <summary>Data your page receives (development only)</summary>
        <pre id="log">Complete the flow to see the result…</pre>
      </details>
    </main>

    <script type="module" src="src/website-brief.js"></script>
    <script>
      const brief = document.getElementById('brief');
      const log = document.getElementById('log');
      const headings = {
        en: ['Your website, ready in minutes', 'Answer a few quick questions and our AI builds it for you.'],
        es: ['Tu sitio web, listo en minutos', 'Responde unas preguntas rápidas y nuestra IA lo construye por ti.'],
      };

      document.querySelectorAll('[data-lang]').forEach((btn) =>
        btn.addEventListener('click', () => {
          const lang = btn.dataset.lang;
          brief.setAttribute('lang', lang);
          document.documentElement.lang = lang;
          document.getElementById('headline').textContent = headings[lang][0];
          document.getElementById('subline').textContent = headings[lang][1];
          document.querySelectorAll('[data-lang]').forEach((b) => b.setAttribute('aria-pressed', b === btn));
        })
      );

      brief.addEventListener('wb:step', (e) => {
        log.textContent = 'wb:step → ' + JSON.stringify(e.detail);
      });

      brief.addEventListener('wb:submit', (e) => {
        const { prompt, brief: data, assets } = e.detail;
        const short = {
          ...assets,
          logo: assets.logo && { ...assets.logo, dataUrl: assets.logo.dataUrl.slice(0, 40) + '…' },
          photos: assets.photos.map((p) => ({ ...p, dataUrl: p.dataUrl.slice(0, 40) + '…' })),
        };
        log.textContent =
          'AI PROMPT\n\n' + prompt +
          '\n\nBRIEF\n\n' + JSON.stringify(data, null, 2) +
          '\n\nFILES\n\n' + JSON.stringify(short, null, 2);
      });
    </script>
  </body>
</html>
